name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend Test Suite & Migration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install Dependencies from Lockfile with Hash Verification
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements.lock

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest -v --tb=short

      - name: Validate Alembic Migrations on Disposable SQLite DB
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/disposable_ci_test.db
        run: |
          cd backend
          alembic upgrade head
          rm -f /tmp/disposable_ci_test.db
